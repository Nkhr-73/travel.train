
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusMap Itoshima</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">🚌</div>
      <div>
        <h1>BusMap <span>Itoshima</span></h1>
        <p>ITOSHIMA BUS NETWORK</p>
      </div>
    </div>

    <div class="header-status">
      <span class="status-dot"></span>
      MAP SYSTEM
    </div>
  </header>

  <main class="main-container">

    <aside class="sidebar">

      <section class="welcome">
        <p class="eyebrow">WELCOME</p>
        <h2>糸島のバスを、<br>ひとつの地図に。</h2>
        <p class="description">
          糸島市内を走るバスの運行状況を
          地図上で確認できる交通マップ。
        </p>
      </section>

      <section class="info-card">
        <p class="card-label">CURRENT MAP</p>
        <h3>糸島市周辺</h3>
        <p>Fukuoka, Japan</p>
        <div class="map-status">
          <span></span>
          地図システム稼働中
        </div>
      </section>

      <section class="route-section">
        <div class="section-heading">
          <h3>路線一覧</h3>
          <span>PHASE 2</span>
        </div>

        <div class="empty-state">
          <span>🚏</span>
        <div class="route-section">
  <h3>路線一覧</h3>
  <p class="route-note">路線を選ぶと地図に表示されます</p>

  <div id="routeList"></div>
</div>
        
      </section>

      <div class="sidebar-footer">
        <p>BusMap Itoshima</p>
        <small>VERSION 1.0.0</small>
      </div>

    </aside>

    <section class="map-container">
      <div class="map-top">
        <div>
          <span class="map-label">LIVE MAP</span>
          <h2>糸島市 バス運行マップ</h2>
        </div>
        <button id="resetMap" class="reset-button">
          ↗ 初期位置に戻る
        </button>
      </div>

      <div id="map"></div>

      <div class="map-footer">
        <span>© OpenStreetMap contributors</span>
        <span>BUSMAP ITOSHIMA</span>
      </div>
    </section>

  </main>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script src="js/map.js"></script>

</body>
</html>
